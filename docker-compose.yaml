services:
  autosubrt:
    image: gogoshine/autosubrt:latest
    #image: gogoshine/autosubrt:sha-190a61f
    ports:
      - "30001:30000"
    volumes:
      - /opt/1panel/apps/openresty/openresty/www/sites/autosubrt.jcaigc.cn/index/output:/app/output  # 挂载配置文件目录
      - /opt/1panel/apps/openresty/openresty/www/sites/autosubrt.jcaigc.cn/index/models/asr_models:/app/models  # 挂载语音识别模型数据
      - /etc/localtime:/etc/localtime:ro  # 挂载主机时区
      - /etc/timezone:/etc/timezone:ro    # 挂载时区名称（可选）
    environment:
      # 用于将容器内部的文件路径转成URL，本质是将/app/替换成DOWNLOAD_URL得到下载路径
      - DOWNLOAD_URL=https://autosubrt.jcaigc.cn/
      # 语音识别模型目录，首次启动会自动下载模型到此处
      - MODEL_DIR=/app/models
      # HuggingFace 模型下载源，默认使用国内镜像；海外部署可改为 https://huggingface.co
      - HF_ENDPOINT=https://hf-mirror.com
      # Xet 传输协议：开启后会直连 cas-server.xethub.hf.co，用镜像时该服务返回 401 导致大模型下载失败，
      # 因此非官方源下 config.py 已自动关闭（见 config.py 中的说明）；如需强制开关可在此显式指定
      #- HF_HUB_DISABLE_XET=1
      # 识别模型：large-v3 / large-v3-turbo / medium / small
      - ASR_MODEL=large-v3
      # 推理设备与精度：auto 表示有 GPU 用 GPU(float16)，否则用 CPU(int8)
      - ASR_DEVICE=auto
      # 识别语言，zh 表示固定中文
      - ASR_LANGUAGE=zh
      # CPU 推理线程数，需与 cpus 配额匹配；留空或设为 0 则按 cgroup 配额自动设置
      - ASR_CPU_THREADS=3
      # 标点恢复：whisper 对中文标点不可靠，开启后保证接口输出的 text 一定带标点
      - PUNCT_ENABLED=true
      # 标点模型（ct-punc ONNX），首次启动自动下载到 MODEL_DIR（约 295MB）
      - PUNCT_MODEL=csukuangfj/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12
      # 标点模型 ONNX 推理线程数，留空或设为 0 则按 cgroup 配额自动设置
      - PUNCT_CPU_THREADS=3
      # 文件大小限制（字节），默认100MB
      - FILE_SIZE_LIMIT=104857600
      # 计费：开启后所有 ASR 接口必须传 apiKey，并按音频时长扣费（积分）
      # 只认 true/false，写成 1 会被当成 false 从而关闭计费（启动日志会打印生效值）
      - ENABLE_APIKEY=true
      # 计费单价（积分/秒），默认 0.00022
      - POINTS_PER_SECOND=0.00022
    mem_limit: 8G     # 内存限制
    memswap_limit: 8G # 总内存（物理内存 + Swap）限制
    cpus: '3.5'       # CPU使用率限制为150%，即容器最多可以使用1.5个完整的CPU核心
    oom_score_adj: -500  # 调整 OOM 杀手优先级
    restart: unless-stopped  # 除非手动停止，否则总是重启容器
    container_name: autosubrt # 这里指容器名称，非必需，不指定时，名称为：<项目名称>-<服务名称>-<序号>
    #entrypoint: ["/bin/sh", "-c", "sleep 10000"]