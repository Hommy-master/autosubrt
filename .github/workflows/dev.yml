name: Docker Image CI Dev

on:
  # 仅在推送 v 开头的 tag 时构建并发布镜像；
  # 提交到 main 不再触发构建，需要发版时打 tag 即可。
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# 同一个 tag 重复推送时，后一次排队等待，避免并发推送互相覆盖镜像标签
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 准备代码
        uses: actions/checkout@v4

      - name: 准备生产环境文件
        run: |
          # dist 是构建产物目录，未被 Git 跟踪，需要先创建
          mkdir -p dist
          # 复制源代码
          cp *.py dist/
          # 复制依赖配置文件
          cp pyproject.toml dist/
          cp uv.lock dist/

      - name: 查看文件和目录结构
        run: ls -lha dist -R

      - name: 准备打包Docker镜像的环境
        uses: docker/setup-buildx-action@v3

      # 登录到Docker Hub
      - name: 登录Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 提取标签信息 - 使用与登录相同的Secret变量名
      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autosubrt  # 统一使用DOCKERHUB_USERNAME（无下划线）
          # 每一行是一个标签规则，注意不要写行内注释，会被当成标签内容：
          #   type=ref,event=tag    -> 版本号，如 v2.0.1
          #   type=sha,format=short -> 提交短哈希，如 sha-190a61f
          #   type=raw,value=latest -> docker-compose 默认拉取的标签
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest

      # 调试步骤：检查生成的标签
      - name: 显示生成的镜像标签
        run: echo "${{ steps.meta.outputs.tags }}"

      # 构建并推送Docker镜像
      - name: 构建并推送Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
